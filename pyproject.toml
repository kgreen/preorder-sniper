[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "preorder-sniper"
version = "0.1.0"
description = "Single-user stock watcher with assisted Playwright checkout"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "playwright>=1.48,<2",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[project.scripts]
preorder-sniper = "preorder_sniper.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
include = ["preorder_sniper*"]
